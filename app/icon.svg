<!--
  Sekme ikonu. Uygulamadaki işaretin aynısı: beş basamak, en üstü vurgu renginde.

  Şeffaf değil, dolu bir karo: şeffaf ikon açık sekme çubuğunda kayboluyor,
  koyuda ince çubuklar okunmuyor. Karo iki temada da aynı görünüyor.
-->
