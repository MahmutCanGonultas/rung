<!--
  Sekme ikonu — uygulamadaki işaretin aynısı: merdiven profili, son basamak
  vurgu renginde.

  Şeffaf değil, dolu bir karo: şeffaf ikon açık sekme çubuğunda kayboluyor,
  koyuda ince çizgiler okunmuyor. Karo iki temada da aynı görünüyor.

  Çizgi kalınlığı 20 kutuya göre değil 32'ye göre yeniden ölçüldü — küçültünce
  ince kalıyordu.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#12161a"/>
  <g fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 25h5.5v-6H17v-6h5.5V7H24" stroke="#e8edf1" stroke-opacity="0.55"/>
    <path d="M24.5 7H26.5" stroke="#35d39b"/>
  </g>
</svg>
