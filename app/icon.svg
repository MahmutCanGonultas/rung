<!--
  Sekme ikonu.

  ÇİZGİ DEĞİL BLOK. Konturla çizilen bir sürüm 32'lik karoda güzel duruyor
  ama 16px'lik sekmede 1,7 CSS piksele inip bulanıklaşıyor; ölçüldü ve üç
  aday yan yana çizildi. Katı siluet aynı boyutta keskin kalıyor.

  ÜÇ basamak, beş değil. Ölçüldü: 32'lik karoda beş basamak 1,25 birimlik
  açıklık bırakıyor, 16px'te 0,6 CSS px — kapanıyor ve merdiven gri bir bloğa
  dönüyor. Üçte her basamak 7,33 birim, 16px'te 3,7 px. Bir logo ailesinde
  ikonun sadeleşmesi normaldir: aynı fikir, başka punto.

  TEK SİLUET, ÜÇ AYRI BLOK DEĞİL. Önceki sürüm üç bloğu farklı saydamlıkla
  çiziyordu ve sonuç ÇUBUK GRAFİĞİ gibi okunuyordu — üç ayrı sütun, aralarında
  ilişki yok. Şimdi tek bir dolu profil: siluet basamak basamak yükseliyor,
  yani "rung" ne demekse ekranda o duruyor.

  RENKLER MARKANIN. Önceki sürüm arduvaz zemin üzerinde MAVİ çiziyordu
  (#6e86f8) — paletin tamamen dışında bir renk, sitenin geri kalanı kayısı ve
  pas iken. Karo artık koyu bandın kendi eriği, merdiven de vurgu rengi.

  Basamakların üstünde açık kayısı bir iz: 3B modeldeki üst yüz ışığının
  aynısı. Beyaz DEĞİL — beyaz, turuncunun üstünde gri bir dikişe dönüyor ve
  ışık gibi değil kusur gibi okunuyor.

  Şeffaf değil dolu karo: şeffaf ikon açık sekme çubuğunda kayboluyor.
  Bloklar 5..27 arasında (iki yanda 5 birim pay), taban 26'da.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a1e"/>
      <stop offset="1" stop-color="#34242b"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.4" fill="url(#tile)"/>
  <path d="M5 26V18.5h7.33V13.5h7.33V8.5H27V26Z" fill="#ff8a5c"/>
  <path d="M5 18.5h7.33" stroke="#ffb490" stroke-width="1.2"/>
  <path d="M12.33 13.5h7.33" stroke="#ffb490" stroke-width="1.2"/>
  <path d="M19.66 8.5H27" stroke="#ffc7ab" stroke-width="1.2"/>
</svg>
