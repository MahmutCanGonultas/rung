  <g fill="#e8edf1" opacity="0.42">
    <rect x="4.2" y="21.2" width="3.4" height="6.6" rx="1.7"/>
    <rect x="9.25" y="18.2" width="3.4" height="9.6" rx="1.7"/>
    <rect x="14.3" y="15.1" width="3.4" height="12.7" rx="1.7"/>
    <rect x="19.35" y="12.0" width="3.4" height="15.8" rx="1.7"/>
  </g>
  <rect x="24.4" y="8.2" width="3.4" height="19.6" rx="1.7" fill="#35d39b"/>
</svg>
